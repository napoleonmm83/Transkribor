# Werkzeug-Konfiguration für Transkribor.
#
# Bewusst OHNE [project] und OHNE [build-system]: Transkribor wird nicht als
# Python-Paket gebaut und installiert. Die Laufzeit-Abhängigkeiten stehen
# weiterhin in requirements.txt — diese Datei konfiguriert die Werkzeuge und
# benennt sie (siehe [dependency-groups] unten).

# Die Analyse-Werkzeuge, damit ein frischer Clone dieselben Fassungen bekommt.
# PEP 735; braucht kein [project] und wird von pip ab 25.1 verstanden:
#   .venv/bin/pip install --group dev
# Exakt gepinnt, weil ein Linter mit anderer Fassung andere Befunde meldet —
# und ein Riegel, der je Rechner anders urteilt, ist kein Riegel.
[dependency-groups]
dev = [
  "ruff==0.16.7",
  "mypy==2.3.1",
  "pytest==9.1.1",
  "hypothesis==6.168.0",
  "mutmut==3.8.0",
]

[tool.ruff]
line-length = 100
# Gemessen, nicht geraten: .github/workflows/test.yml fährt python-version 3.13,
# die Projekt-venv ist 3.13.5.
target-version = "py313"
# `.code-guardian-evidence` ist der untracked Ablageordner des Guardians: in der CI
# gibt es ihn gar nicht, lokal steuerte er 67 der 199 Befunde bei (gemessen
# 2026-09-03). Ohne den Ausschluss urteilt `scripts/ruff_riegel.py` auf dem Rechner
# des Entwicklers anders als in der CI — und ein Riegel, der je Ort anders urteilt,
# ist keiner (dieselbe Begruendung wie beim exakten Fassungs-Pin oben).
extend-exclude = [".venv", "node_modules", "webtool/frontend", ".code-guardian-evidence"]

[tool.ruff.lint]
# Einstiegssatz, bewusst schmal: E/F Syntax und echte Fehler, I Import-Ordnung,
# UP veraltete Schreibweisen, B die Bugbear-Fallen, S die Sicherheitsformen.
# Erweitert wird, wenn dieser Satz sauber ist — nicht vorher.
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["E501"]   # Zeilenlänge ist Sache des Formatierers, nicht des Linters

[tool.ruff.lint.per-file-ignores]
# assert IST der Zweck eines Tests, kein Sicherheitsrisiko. Ohne diese Zeilen
# meldet ruff 2357 S101-Befunde aus den Testdateien — 95 % aller Funde — und
# ein Gate, das zu 95 % aus Rauschen besteht, wird abgeschaltet.
# Gemessen: ruff check --select E,F,I,UP,B,S --ignore E501 . → 2486 Funde,
# davon 2357 S101.
#
# Die Muster stehen so, weil dieses Projekt KEIN tests/-Verzeichnis hat:
# die 23 Suiten liegen als webtool/test_*.py neben dem Code, eine weitere
# als build/test_bilder.py, zwei als scripts/test_*.py.
"**/test_*.py" = ["S101"]
"**/*_test.py" = ["S101"]

[tool.mypy]
python_version = "3.13"
# NICHT strict beim ersten Mal. strict = true auf einem Bestandsprojekt erzeugt
# hunderte Befunde, und ein Gate mit hunderten Befunden ist kein Gate.
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
# Plattform und Paketsicht sind FESTGENAGELT, weil mypy sonst je Ort anders
# urteilt — dieselbe Begruendung wie beim exakten Fassungs-Pin oben, nur dass
# sie hier zweimal gemessen ist (2026-09-04, mypy 2.3.1, derselbe Baum):
#
#   Standard (Windows)            68 Befunde in 19 Dateien
#   --platform linux              70   (+2: `WinDLL` und `get_last_error` in
#                                       webtool/sperre.py — Meldungen ueber
#                                       Code, der nur unter Windows laeuft)
#   --no-site-packages            65   (und teils ANDERE Befunde, nicht bloss
#                                       weniger: build/marke.py `LANCZOS`,
#                                       ytdlp_update.py:121 misc+assignment
#                                       fallen weg, diarize.py:124 wechselt von
#                                       `assignment` auf `no-redef`)
#
# `platform = "win32"`: der ubuntu-Laeufer saehe sonst die zwei Fehlalarme oben.
# `--platform` ist eine statische Annahme, kein Laufzeitmerkmal — der Job auf
# ubuntu urteilt damit ueber dieselbe Sicht wie der Entwicklerrechner. Preis:
# die zwei winzigen `sys.platform == "darwin"`-Zweige (webtool/device.py:24,
# transcribe.py:47) gelten als unerreichbar und werden nicht geprueft.
#
# `no_site_packages = true`: der CI-Job installiert nur die dev-Gruppe, dieser
# Rechner hat fastapi, pillow, torch und pytest. Ohne die Zeile entscheidet
# also der Paketstand darueber, was der Riegel sieht. Preis, benannt statt
# verschwiegen: Fehlgriffe in fastapi-/pillow-Aufrufen faengt mypy nicht mehr —
# `build/marke.py:272` (PIL `LANCZOS` an der alten Stelle) ist ein echter
# Befund, der dadurch entfaellt. Ausweg, falls das je zaehlt: die typisierten
# Pakete im Job installieren.
platform = "win32"
no_site_packages = true
# `dist` ist der electron-builder-Ausgabeordner und traegt unter
# `dist/win-unpacked/resources/py/webtool/` eine KOPIE des Quellbaums. mypy
# bricht daran ab, bevor es irgendetwas prueft:
#     webtool\__init__.py: error: Duplicate module named "webtool"
#     Found 1 error in 1 file (errors prevented further checking)     rc 2
# Das sieht wie EIN Typfehler aus und ist keiner — es ist ein Lauf, der nichts
# angesehen hat. Der Ordner ist gitignoriert, existiert in der CI also nie: ohne
# diese Zeile urteilen Entwicklerrechner und CI verschieden, und zwar so, dass
# der Rechner gar nicht urteilt. Dieselbe Entscheidung wie
# `.code-guardian-evidence` in `extend-exclude` oben.
#
# `build` steht hier bewusst NICHT: der Ordner traegt getrackten Quelltext
# (build/marke.py, build/test_bilder.py) und liegt in pytests `testpaths`.
exclude = "^(\\.venv|node_modules|webtool/frontend|dist)/"

[tool.pytest.ini_options]
# `build` steht in pytests eingebauter norecursedirs-Liste und wird ohne
# ausdrückliche Nennung NIE gesammelt — deshalb steht es hier explizit.
# `scripts` steht hier, weil ein blankes `pytest` an der Wurzel vor Einführung
# dieser Datei rekursiv auch scripts/ einsammelte (13 Tests). Ohne die Zeile
# hätte diese Datei sie still stillgelegt.
# Gemessen: pytest --collect-only -q → 1139 ohne scripts, 1152 mit.
# `docs` seit PR #531: docs/bugsink/ traegt den Envelope-Sammler samt Test.
testpaths = ["webtool", "build", "scripts", "docs"]
# KEIN `-q` in addopts: test.yml ruft bereits mit -q auf, und zusammen ergäbe
# das -qq. Ab verbosity < -1 unterdrückt pytest die Zusammenfassungszeile
# ("1134 passed, 5 skipped") vollständig — genau die Zeile, auf die sich die
# Messungen in den CI-Kommentaren stützen. `--strict-config` ist davon nicht
# betroffen und steht deshalb sehr wohl hier; warum, steht gleich unten.
#
# `-m "not renovate"` nimmt den einen Test heraus, der einen ECHTEN Renovate-Lauf
# faehrt (#539, ~100 MB Download plus Registry-Abfragen); der Job `Renovate-Regeln`
# holt ihn mit `-m renovate` wieder herein. `--strict-markers` ist der Riegel
# darueber: ohne ihn waere ein Tippfehler im Markernamen stumm, der Test liefe
# ueberall mit, und niemand saehe es an einer Meldung.
addopts = ["--strict-config", "--strict-markers", "-m", "not renovate"]
#
# ── Ein Hänger wird von keinem Test rot (#576) ──────────────────────────────
#
# WAS DER VORFALL AUS #576 WIRKLICH WAR — gemessen, nachdem der Kalt-Review die
# ursprüngliche Begründung dieses Blocks widerlegt hatte. Der Issue-Titel sagt
# "45 Minuten Job-Grenze", und genau das stand hier zuerst. Der Lauf selbst sagt
# etwas anderes:
#     gh api repos/napoleonmm83/Transkribor/check-runs/101444180736/annotations
#     → "The hosted runner lost communication with the server."
#     gh api .../actions/jobs/101444180736/logs  → HTTP 404, BlobNotFound
# Der LÄUFER ist verloren gegangen; das Protokoll fehlt, weil er es nie
# hochgeladen hat, nicht weil ein Schnitt es abgeschnitten hätte. Für DIESEN
# Vorfall hätte keine Job-Zeitgrenze früher gegriffen und keine ein Protokoll
# erzeugt. Die Annotation nennt als eine Ursache aber ausdrücklich, dass etwas
# im Workflow den Läufer "starves for CPU/Memory" — und dagegen hilft, einen
# entlaufenen Test früh abzubrechen. Mehr behauptet dieser Block nicht: er
# deckt die NACHBARKLASSE, nicht den dokumentierten Vorfall.
#
# `faulthandler_exit_on_timeout` ist dabei die tragende Hälfte, nicht der
# Stapelabzug: pytest beendet sich damit SELBST. Mutation gemessen — Schalter
# auf `false` ⇒ der Abzug erscheint, der Lauf hängt weiter und wird von aussen
# abgewürgt (rc 124); auf `true` ⇒ rc 1, Abzug ALLER Threads (auch der
# Hintergrund-Threads), hängender Test mit Zeile benannt.
#
# DREI LÜCKEN, alle nachgemessen — wer sich hierauf verlässt, muss sie kennen:
#  1. Nach einem ROTEN Test ist der Riegel für dieses Item AUS
#     (`_pytest/faulthandler.py`: `pytest_exception_interact` bestellt den
#     Timer ab). Roter Test + hängender Fixture-Abbau ⇒ rc 124. Ausgerechnet
#     die #576-Hypothese "eine Sperre wird nicht freigegeben" lebt im Abbau.
#  2. Ein Hänger NACH dem letzten Test ist gar nicht gedeckt: der Timer hängt
#     am Testprotokoll eines Items. Gemessen: Ausgabe "1 passed", Prozess
#     steht, rc 124 — das Protokoll behauptet Erfolg, während nichts mehr geht.
#  3. Sammeln, Fixture-Aufbau auf Sitzungsebene und der pip-Schritt liegen
#     ausserhalb. Dafür gibt es `timeout-minutes` in test.yml — als Deckel,
#     nicht als Diagnose.
#
# `--strict-config` oben ist der Riegel GEGEN DAS SCHWEIGEN DIESES RIEGELS.
# Ein Buchstabendreher im Schlüssel schaltet ihn sonst still ab: pytest warnt
# zwar, aber erst in der Zusammenfassung — die ein hängender Lauf nie erreicht.
# Gemessen mit `faulthandler_timout`: ohne die Option rc 124 (hängt weiter,
# Warnung ungelesen), mit ihr rc 4 und "Unknown config option" VOR dem ersten
# Test. Dieselbe Regel wie bei ruff_riegel.py und mypy_riegel.py: wer einen
# Riegel baut, baut zuerst den Riegel gegen dessen eigenes Schweigen.
#
# 300 s ist PRO TEST, nicht für den Lauf, und die Zahl ist gemessen statt
# geraten: langsamster Test 3,52 s
# (test_diarize.py::test_waechter_die_griffpunkte_gibt_es_im_ECHTEN_pyannote),
# ganze Suite 47,95 s bei 1395 Tests. Das sind ~85× Reserve auf den langsamsten
# Einzeltest — ein CI-Läufer ist langsamer als dieser Rechner, aber nicht um
# diesen Faktor. Wer hier einen Test einbaut, der wirklich Minuten braucht,
# hebt die Zahl und schreibt dazu, welcher.
#
# Preis, benannt: faulthandler steigt hart aus, die Zusammenfassungszeile
# ("N passed") fehlt nach einem Timeout.
faulthandler_timeout = 300
faulthandler_exit_on_timeout = true

# `renovate` (#539) faehrt einen ECHTEN Renovate-Lauf: npx laedt ~100 MB und fragt
# Registries ab. Das gehoert nicht in jede Suite, aber es gehoert auch nicht hinter
# einen Umgebungsschalter: ein uebersehener Schalter LAESST DEN TEST STILL AUS, und
# der eigene Job waere gruen, ohne etwas gefahren zu haben — genau die Klasse, gegen
# die dieser Test gebaut ist. Ein Marker faellt dagegen laut aus: passt er nicht mehr,
# sammelt `pytest -m renovate` im eigenen Job NULL Tests ein und endet mit rc 5.
# `--strict-markers` ist der Riegel darueber (ein Tippfehler im Marker ist sonst
# stumm); im eigenen Baum wird ausser `parametrize` und `skipif` nichts markiert,
# er kostet also nichts.
markers = [
  "renovate: faehrt einen echten Renovate-Lauf (#539); nur im Job `Renovate-Regeln`",
]

[tool.mutmut]
# Beratend, kein Riegel: mutmut kennt nur Pfade, nicht geänderte Zeilen — ein
# Gate, das bei jeder Änderung das halbe Projekt mutiert, läuft Minuten und
# wird abgeschaltet.
#
# source_paths statt des älteren paths_to_mutate, und beide Werte sind LISTEN:
# mutmut 3.7 rechnet intern [] + <wert>, ein String bricht das Laden der
# Konfiguration mit TypeError ab.
source_paths = ["webtool/"]
pytest_add_cli_args_test_selection = ["webtool/"]
do_not_mutate = ["*/test_*.py"]
