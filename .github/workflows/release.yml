name: Release

# Getaggter Push (v*) baut die Installer aller drei Plattformen; workflow_dispatch tut
# dasselbe fuer einen beliebigen Branch, um vor einem echten Release testen zu koennen.
#
# Warum eine Matrix und kein einzelner Job: ein macOS-dmg laesst sich NUR auf einem
# macOS-Runner bauen (Codesign-Werkzeuge, hdiutil), ein deb sinnvoll nur auf Linux.
# Cross-Building gibt es dafuer nicht.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write            # das Release anlegen und die Assets hochladen

jobs:
  bauen:
    strategy:
      fail-fast: false       # ein gescheiterter Mac-Build darf Windows nicht mitreissen
      matrix:
        include:
          - os: windows-latest
            name: windows
            muster: dist/*.exe
          - os: macos-latest         # seit macos-14 arm64 — passt zu build.mac.arch
            name: macos
            muster: dist/*.dmg
          - os: ubuntu-latest
            name: linux
            muster: |
              dist/*.AppImage
              dist/*.deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Umgebungsbefund VOR dem Bau: scheitert der Lauf, ist das die erste Frage.
      - name: Umgebung
        shell: bash
        run: |
          echo "runner   : ${{ matrix.os }} / $(uname -sm 2>/dev/null || echo windows)"
          echo "node     : $(node -v)   npm: $(npm -v)"
          echo "python   : $(python3 --version 2>&1 || python --version 2>&1 || echo 'keins')"
          echo "electron : $(node -p "require('./package.json').devDependencies.electron")"
          echo "builder  : $(node -p "require('./package.json').devDependencies['electron-builder']")"
          echo "targets  : $(node -p "JSON.stringify(require('./package.json').build[process.env.PL]||{})")"
        env:
          PL: ${{ matrix.name == 'macos' && 'mac' || matrix.name == 'windows' && 'win' || 'linux' }}

      - run: npm ci --no-audit --fund=false

      - run: npm run test:electron        # billig, und schlaegt vor dem teuren Bau fehl

      # electron-updater vergleicht die Version aus der package.json, NICHT den Tag. Ein Tag
      # v0.2.0 auf einer package.json mit 0.1.0 baut Installer, die sich als 0.1.0 ausgeben —
      # das Update erreicht dann nie jemanden, und niemand sieht warum. Also hier abbrechen.
      - name: Tag und package.json muessen uebereinstimmen
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "Tag v$tag passt nicht zu package.json $pkg — Version vor dem Taggen anheben."
            exit 1
          fi
          echo "Tag und Version stimmen ueberein: $pkg"

      # Ohne Tag ist es ein Testbau: die Laufnummer in die Version stempeln, sonst heissen die
      # Installer aus zehn Laeufen gleich und man weiss nicht, welchen man geladen hat.
      # Nur im Runner-Arbeitsverzeichnis — commitet wird das nie.
      - name: Testbau kennzeichnen
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        run: |
          npm pkg set "version=$(node -p "require('./package.json').version")-build${GITHUB_RUN_NUMBER}"
          echo "Version fuer diesen Bau: $(node -p "require('./package.json').version")"

      # Das Frontend wird mitgebaut: der Installer liefert webtool/static aus,
      # dort steht sonst nichts (git-ignoriert, reiner Build-Output).
      #
      # macOS-Signatur: KEIN CSC_IDENTITY_AUTO_DISCOVERY=false mehr. Das liess
      # electron-builder das Signieren ganz aus — und weil das Umpacken die von
      # Electron mitgelieferte Signatur ohnehin zerstoert, kam die App beim Nutzer
      # ohne gueltige Signatur an: macOS meldet dann „ist beschaedigt" und bietet
      # KEIN Oeffnen-trotzdem an. `mac.identity: "-"` (package.json) signiert
      # stattdessen ad-hoc — ohne Zertifikat, aber gueltig. Signatur mit Developer
      # ID + Notarisierung bleibt eine eigene, spaetere Spec.
      - run: npm run dist
        env:
          DEBUG: electron-builder          # jeder Schritt benannt, statt nur "exit 1"

      # Was ist tatsaechlich entstanden? Ohne diese Liste raet man bei einem leeren Upload.
      - name: Inhalt von dist/
        if: always()
        shell: bash
        run: ls -la dist/ || echo "dist/ existiert nicht"

      - uses: actions/upload-artifact@v7
        with:
          name: installer-${{ matrix.name }}
          path: ${{ matrix.muster }}
          if-no-files-found: error      # ein leerer Upload sieht sonst wie Erfolg aus

      # Bei einem Fehlschlag die Spuren mitnehmen: builder-debug.yml nennt die genaue
      # electron-builder-Konfiguration nach dem Aufloesen, die npm-Logs den Ursprung
      # eines gescheiterten Downloads.
      - name: Fehlerspuren sichern
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fehlerspur-${{ matrix.name }}
          path: |
            dist/builder-debug.yml
            dist/builder-effective-config.yaml
            ~/.npm/_logs/
          if-no-files-found: ignore

  veroeffentlichen:
    # Kein `if`: der Job laeuft per Voreinstellung nur, wenn ALLE Matrix-Plattformen
    # gebaut haben. Das ist Absicht — ein Release, in dem eine Plattform fehlt, ist
    # schlimmer als keines: der Nutzer laedt es und findet seine Datei nicht. Die
    # Artefakte der erfolgreichen Jobs liegen unabhaengig davon zum Download bereit.
    needs: bauen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artefakte
          merge-multiple: true
      - name: Release-Namen bestimmen
        id: name
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
            echo "vorab=false" >> "$GITHUB_OUTPUT"
          else
            # Kein Tag: ein Testbau. Eigener Name, damit er den echten v-Tag nicht belegt.
            echo "tag=v$(node -p "require('./package.json').version")-build${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "vorab=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Draft-Release anlegen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          ls -la artefakte/
          gh release create "${{ steps.name.outputs.tag }}" \
            --draft \
            ${{ steps.name.outputs.vorab == 'true' && '--prerelease' || '' }} \
            --target "${GITHUB_SHA}" \
            --title "Transkribor ${{ steps.name.outputs.tag }}" \
            --notes "Unsignierte Testbauten aus \`${GITHUB_REF_NAME}\` (${GITHUB_SHA:0:7}).

          **macOS:** ad-hoc signiert, nicht notarisiert — beim ersten Start blockt Gatekeeper. Rechtsklick auf die App > *Öffnen*; wird das nicht angeboten (macOS 15+), einmal starten und dann *Systemeinstellungen > Datenschutz & Sicherheit > Dennoch öffnen*.
          **Windows:** unsigniert — SmartScreen zeigt *Weitere Informationen* > *Trotzdem ausführen*.

          Beim ersten Start richtet die App die Python-Seite selbst ein (mehrere GB, 10–30 Minuten)." \
            artefakte/*
