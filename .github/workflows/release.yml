name: Release

# Drei Wege hier hinein:
#   1. workflow_dispatch, freigeben=false -> Testbau. Entwurf mit Laufnummer, belegt
#      keinen echten Tag. Die Vorgabe, damit ein Fehlklick nichts veroeffentlicht.
#   2. workflow_dispatch, freigeben=true  -> echtes Release. Die HOEHE der Version kommt
#      aus den Commit-Typen seit dem letzten Tag (feat -> minor, fix/perf -> patch,
#      "!" oder BREAKING CHANGE -> major); der ZEITPUNKT ist dieser Klick.
#   3. Getaggter Push v*                  -> echtes Release aus einem Tag von Hand.
#
# Warum nicht bei jedem Merge auf master: an jeder Version haengen hier drei Runner, vier
# Installer und ein Update-Prompt beim Nutzer. Das pro Tippfehler-Fix auszuloesen ist
# Rauschen. Die Zahl automatisch zu bestimmen loest das eigentliche Problem (niemand denkt
# ans Anheben), ohne den Zeitpunkt aus der Hand zu geben — dieselbe Trennung wie bei
# release-please, nur ohne die Abhaengigkeit.
#
# Warum eine Matrix und kein einzelner Job: ein macOS-dmg laesst sich NUR auf einem
# macOS-Runner bauen (Codesign-Werkzeuge, hdiutil), ein deb sinnvoll nur auf Linux.
# Cross-Building gibt es dafuer nicht.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      freigeben:
        description: 'Echtes Release veroeffentlichen (Version wird automatisch hochgezaehlt)'
        type: boolean
        default: false

# Zwei Merges kurz hintereinander wuerden sonst gleichzeitig die Version hochzaehlen und
# sich gegenseitig den Push zerschiessen. Nicht abbrechen: ein halb fertiges Release ist
# schlimmer als eines, das wartet.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write            # das Release anlegen, die Assets hochladen, die Version pushen

jobs:
  # Entscheidet, WAS dieser Lauf ist, und hebt bei einem Merge die Version.
  version:
    runs-on: ubuntu-latest
    outputs:
      art: ${{ steps.plan.outputs.art }}       # release | test | keine
      ref: ${{ steps.plan.outputs.ref }}       # was gebaut wird (leer = Vorgabe)
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0     # ohne Historie und Tags findet scripts/fassung.sh nichts
      - id: plan
        shell: bash
        run: |
          set -euo pipefail
          schreib() { echo "$1=$2" >> "$GITHUB_OUTPUT"; }

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "Von Hand gesetzter Tag — bauen und veroeffentlichen."
            schreib art release; schreib tag "${GITHUB_REF#refs/tags/}"; schreib ref ""
            exit 0
          fi
          if [ "${{ inputs.freigeben }}" != "true" ]; then
            echo "Testbau — nichts wird veroeffentlicht, die Version bleibt unangetastet."
            schreib art test; schreib tag ""; schreib ref ""
            exit 0
          fi

          # Die drei Skripte werden HIER geprueft — VOR ihrer ersten Benutzung, nicht erst
          # vor dem Push. `bauen` haengt an `version`, dort liefe der Test also erst, nachdem
          # dieser Job Version UND rotierte Notizdatei schon nach master gepusst hat: eine
          # Wache hinter dem, was sie bewachen soll, ist keine. Bis #472 standen sie zwar vor
          # dem Push, aber HINTER den beiden Auswertungen darunter — ein defektes
          # `fassung.sh` haette dann bei „Noch kein v-Tag" abgebrochen und dem Menschen
          # geraten, von Hand zu taggen, waehrend der Test, der genau das gefangen haette,
          # nie lief (in einer Sandbox mit sabotiertem Ausdruck nachgestellt, rc=1 ohne einen
          # Hinweis auf die Ursache). Dasselbe galt vorbestehend fuer versionshoehe.sh.
          #
          # Die Ausgabe wird aufgehoben und NUR im Fehlerfall gedruckt: die Diagnosezeilen
          # („FEHL … erwartet X, bekommen Y") gehen auf stdout, ein blosses `>/dev/null`
          # liesse den Job mit rc=1 und ohne jede Begruendung stehen — und der Bau-Job, wo
          # die Tests sichtbar laufen, kommt dann nie dran.
          #
          # Kosten: die ersten beiden zusammen 1–5 s (gemessen am Schritt „Release-Skripte
          # pruefen" der Testbauten 33193601556 und 33194321729, sechs Matrix-Jobs; lokal
          # 4,9 s); fassung.test.sh legt drei Wegwerf-Repos mit Tags an und kostet lokal
          # 2,4 s (Windows/Git Bash, Minimum aus drei Laeufen — auf Linux weniger, dort
          # sind die vielen kleinen git-Aufrufe billiger).
          for t in versionshoehe notizen fassung; do
            if ! aus="$(bash "scripts/$t.test.sh" 2>&1)"; then
              printf '%s\n' "$aus"
              echo "scripts/$t.test.sh ist rot — Abbruch vor jeder Auswertung."
              exit 1
            fi
          done

          # Welcher Tag eine Fassung IST, entscheidet scripts/fassung.sh. Dort steht auch,
          # warum ein Glob das nicht kann: `modelle-v1` traegt die Sprechertrennungs-Modelle,
          # und die Testbau-Releases heissen `v<version>-build<Laufnummer>` — beides keine
          # Fassung, das zweite aber von `--match "v[0-9]*"` nicht zu trennen (#472).
          # Eigene Datei, damit fassung.test.sh genau das prueft, was hier laeuft —
          # dieselbe Begruendung wie bei versionshoehe.sh eine Zeile weiter unten.
          letzter="$(bash scripts/fassung.sh)"
          if [ -z "$letzter" ]; then
            # Ohne Ausgangspunkt muesste man die GESAMTE Historie auswerten. Den Anfang
            # setzt ein Mensch: einmal `git tag v0.2.0 && git push --tags`.
            echo "Noch kein v-Tag. Den ersten bitte von Hand setzen, danach zaehlt das hier hoch."
            exit 1
          fi

          # Die Entscheidung steht in scripts/versionshoehe.sh, damit
          # scripts/versionshoehe.test.sh genau das prueft, was hier laeuft.
          hoehe="$(bash scripts/versionshoehe.sh "$letzter")"

          if [ -z "$hoehe" ]; then
            # Freigeben angeklickt, aber es gibt nichts freizugeben. Abbrechen statt still
            # ein Release mit identischem Inhalt danebenzustellen.
            echo "Seit $letzter nur chore/docs/ci/test — es gibt nichts zu veroeffentlichen."
            exit 1
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # `npm version` kann die Notizdatei NICHT mitnehmen: es verlangt ein sauberes
          # Arbeitsverzeichnis und kennt in dieser Fassung kein `--force` (nachgesehen in
          # `npm version --help`). Also erst nur die Version bumpen, dann rotieren, dann EIN
          # Commit mit beidem. Waere die Rotation ein zweiter Commit, stuende im Tag eine
          # Notizdatei, deren Abschnitt fuer genau diese Fassung noch fehlt — und der
          # Veroeffentlichungs-Job liest ihn aus genau diesem Tag.
          neu="$(npm version "$hoehe" --no-git-tag-version | tail -1)"
          bash scripts/notizen.sh rotieren RELEASE-NOTIZEN.md "$neu" "$(date -u +%F)"
          git add package.json package-lock.json RELEASE-NOTIZEN.md
          git commit -q -m "chore(release): ${neu#v}"
          # `-a`, und der Tag wird AUSDRUECKLICH gepusht — beides gegen dieselbe Falle.
          # `npm version` erzeugte frueher einen ANNOTIERTEN Tag (nachgemessen: `git cat-file -t`
          # sagt fuer v0.48.1, v0.49.0 und v0.49.1 jeweils `tag`). `--no-git-tag-version` plus
          # ein blosses `git tag` macht einen LEICHTGEWICHTIGEN — und `--follow-tags` pusht nur
          # annotierte. Der Commit laege dann auf master, der Tag nur im Laeufer; `bauen` und
          # `veroeffentlichen` checken `ref: $neu` aus und sterben mit
          # `couldn't find remote ref` (in einer Sandbox mit Bare-Remote nachgestellt, rc=128).
          # Und der zweite Anlauf waere schlimmer als der erste: er zaehlt ab dem letzten
          # ECHTEN Tag erneut hoch, und die eben rotierten Notizen stehen nicht mehr unter
          # `## Unveröffentlicht`.
          # `--atomic` schliesst den Halbzustand ganz: entweder Commit UND Tag landen, oder
          # keines von beidem. Danach wird nachgesehen statt angenommen — ein fehlender Tag
          # soll hier scheitern, nicht drei Bau-Jobs spaeter.
          git tag -a "$neu" -m "chore(release): ${neu#v}"
          echo "Seit $letzter: $hoehe -> $neu"
          git push --atomic origin "HEAD:${GITHUB_REF_NAME}" "refs/tags/$neu"
          git ls-remote --exit-code --tags origin "refs/tags/$neu" >/dev/null \
            || { echo "Der Tag $neu ist nicht auf dem Remote angekommen — Abbruch vor dem Bau."; exit 1; }
          schreib art release; schreib tag "$neu"; schreib ref "$neu"

  bauen:
    needs: version
    strategy:
      fail-fast: false       # ein gescheiterter Mac-Build darf Windows nicht mitreissen
      matrix:
        include:
          # Die `latest*.yml` MUESSEN mit: electron-updater fragt genau diese Datei im
          # Release ab: ohne sie bekommt es einen 404 und meldet nie ein Update. Die
          # `.blockmap` erlaubt differentielle Downloads (nur die geaenderten Bloecke statt
          # 100 MB). Beides entsteht im Bau und fiel vorher durch das Muster `dist/*.exe`.
          - os: windows-latest
            name: windows
            muster: |
              dist/*.exe
              dist/*.blockmap
              dist/latest.yml
          - os: macos-latest         # seit macos-14 arm64 — passt zu build.mac.arch
            name: macos
            muster: |
              dist/*.dmg
              dist/*.blockmap
              dist/latest-mac.yml
          - os: ubuntu-latest
            name: linux
            muster: |
              dist/*.AppImage
              dist/*.deb
              dist/latest-linux.yml
    runs-on: ${{ matrix.os }}
    # Dieser Job SCHREIBT nichts am Repository: er checkt aus, faehrt `npm ci`, die
    # Testsuiten und `npm run dist` (= `electron-builder --publish never`, package.json)
    # und laedt die Artefakte hoch. Ohne diesen Block erbt er das workflow-weite
    # `contents: write`, und gemessen tat er das auch (Lauf 33310938957: `Contents: write`
    # in allen drei Matrix-Jobs). Genau hier laeuft fremder Code — `npm ci` fuehrt die
    # Installationsskripte jeder Abhaengigkeit aus. Ein Schreibrecht daneben ist die
    # teuerste der drei Stellen, an denen es ueberfluessig war.
    #
    # GEMESSEN ist das Ergebnis, nicht der Mechanismus: im Testbau 33429119333 lief der
    # ganze Job mit `Contents: read` durch, Artefakte inklusive. Dass der Upload seinen
    # eigenen Laufzeit-Token nimmt, ist die Erklaerung dafuer — hergeleitet, nicht gemessen.
    permissions:
      contents: read
    steps:
      # Bei einem Release den frisch gesetzten Tag auschecken, nicht den Stand von vorher —
      # sonst baut die Matrix die alte Versionsnummer in die Installer.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.ref }}
          # Derselbe Grund wie im Veroeffentlichen-Job, nur schaerfer: dieser Job fasst git
          # nach dem Auschecken nicht mehr an, faehrt aber `npm ci` — fremde
          # Installationsskripte im selben Arbeitsordner, in dessen `.git/config` der
          # Checkout-Token sonst liegen bliebe (zizmor: artipacked).
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # Umgebungsbefund VOR dem Bau: scheitert der Lauf, ist das die erste Frage.
      - name: Umgebung
        shell: bash
        run: |
          echo "runner   : ${{ matrix.os }} / $(uname -sm 2>/dev/null || echo windows)"
          echo "node     : $(node -v)   npm: $(npm -v)"
          echo "python   : $(python3 --version 2>&1 || python --version 2>&1 || echo 'keins')"
          echo "electron : $(node -p "require('./package.json').devDependencies.electron")"
          echo "builder  : $(node -p "require('./package.json').devDependencies['electron-builder']")"
          echo "targets  : $(node -p "JSON.stringify(require('./package.json').build[process.env.PL]||{})")"
        env:
          PL: ${{ matrix.name == 'macos' && 'mac' || matrix.name == 'windows' && 'win' || 'linux' }}

      - run: npm ci --no-audit --fund=false

      - run: npm run test:electron        # billig, und schlaegt vor dem teuren Bau fehl

      # Die Versionslogik entscheidet ueber Nummern, die man nach dem Veroeffentlichen nicht
      # mehr zurueckholt — sie wird mitgeprueft, nicht nur benutzt. Dasselbe gilt fuer die
      # Notiz-Rotation: sie schreibt in den Release-Commit, und der liegt danach auf master.
      - name: Release-Skripte pruefen
        shell: bash
        run: |
          bash scripts/versionshoehe.test.sh
          bash scripts/notizen.test.sh
          bash scripts/fassung.test.sh

      # electron-updater vergleicht die Version aus der package.json, NICHT den Tag. Ein Tag
      # v0.2.0 auf einer package.json mit 0.1.0 baut Installer, die sich als 0.1.0 ausgeben —
      # das Update erreicht dann nie jemanden, und niemand sieht warum. Also hier abbrechen.
      - name: Tag und package.json muessen uebereinstimmen
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "Tag v$tag passt nicht zu package.json $pkg — Version vor dem Taggen anheben."
            exit 1
          fi
          echo "Tag und Version stimmen ueberein: $pkg"

      # Beim Testbau die Laufnummer in die Version stempeln, sonst heissen die Installer aus
      # zehn Laeufen gleich und man weiss nicht, welchen man geladen hat. Nur im
      # Runner-Arbeitsverzeichnis — commitet wird das nie.
      - name: Testbau kennzeichnen
        if: needs.version.outputs.art == 'test'
        shell: bash
        run: |
          npm pkg set "version=$(node -p "require('./package.json').version")-build${GITHUB_RUN_NUMBER}"
          echo "Version fuer diesen Bau: $(node -p "require('./package.json').version")"

      # Das Frontend wird mitgebaut: der Installer liefert webtool/static aus,
      # dort steht sonst nichts (git-ignoriert, reiner Build-Output).
      #
      # macOS-Signatur: KEIN CSC_IDENTITY_AUTO_DISCOVERY=false mehr. Das liess
      # electron-builder das Signieren ganz aus — und weil das Umpacken die von
      # Electron mitgelieferte Signatur ohnehin zerstoert, kam die App beim Nutzer
      # ohne gueltige Signatur an: macOS meldet dann „ist beschaedigt" und bietet
      # KEIN Oeffnen-trotzdem an. `mac.identity: "-"` (package.json) signiert
      # stattdessen ad-hoc — ohne Zertifikat, aber gueltig. Signatur mit Developer
      # ID + Notarisierung bleibt eine eigene, spaetere Spec.
      # Der Bugsink-DSN (#530) kommt aus dem Secret in die gepackte package.json
      # (`extraMetadata`, gelesen in electron/main.js). Ein Client-Schluessel, kein
      # Geheimnis — aber nicht im oeffentlichen Repo. Fehlt das Secret (Fork), ist der Wert
      # leer und das SDK in der App aus. `shell: bash`, weil der Schritt sonst auf Windows
      # in pwsh liefe und "$BUGSINK_DSN" dort nicht expandiert.
      - shell: bash
        run: npm run dist -- -c.extraMetadata.bugsinkDsn="$BUGSINK_DSN"
        env:
          DEBUG: electron-builder          # jeder Schritt benannt, statt nur "exit 1"
          BUGSINK_DSN: ${{ secrets.BUGSINK_DSN }}

      # Was ist tatsaechlich entstanden? Ohne diese Liste raet man bei einem leeren Upload.
      - name: Inhalt von dist/
        if: always()
        shell: bash
        run: ls -la dist/ || echo "dist/ existiert nicht"

      - uses: actions/upload-artifact@v7
        with:
          name: installer-${{ matrix.name }}
          path: ${{ matrix.muster }}
          if-no-files-found: error      # ein leerer Upload sieht sonst wie Erfolg aus

      # Bei einem Fehlschlag die Spuren mitnehmen: builder-debug.yml nennt die genaue
      # electron-builder-Konfiguration nach dem Aufloesen, die npm-Logs den Ursprung
      # eines gescheiterten Downloads.
      - name: Fehlerspuren sichern
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fehlerspur-${{ matrix.name }}
          path: |
            dist/builder-debug.yml
            dist/builder-effective-config.yaml
            ~/.npm/_logs/
          if-no-files-found: ignore

  veroeffentlichen:
    # Kein `if`: der Job laeuft per Voreinstellung nur, wenn ALLE Matrix-Plattformen
    # gebaut haben. Das ist Absicht — ein Release, in dem eine Plattform fehlt, ist
    # schlimmer als keines: der Nutzer laedt es und findet seine Datei nicht. Die
    # Artefakte der erfolgreichen Jobs liegen unabhaengig davon zum Download bereit.
    needs: [version, bauen]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.ref }}
          # Ohne Historie und Tags findet scripts/fassung.sh nichts — und die braucht
          # der Rueckfall, wenn niemand eine Release-Notiz geschrieben hat: dann entsteht
          # der Text aus den Commit-Betreffen seit dem vorigen Tag. Der Regelfall liest
          # nur eine Datei und kaeme mit Tiefe 1 aus; die Tiefe zahlt also fuer den Fall,
          # der nicht eintreten soll.
          fetch-depth: 0
          # Dieser Job PUSHT nicht — er liest Historie und ruft `gh`, das seinen Token aus der
          # Schritt-Umgebung nimmt (`GH_TOKEN` weiter unten). Ohne diese Zeile bliebe der
          # Checkout-Token in `.git/config` liegen, waehrend der naechste Schritt fremd
          # erzeugte Artefakte in denselben Arbeitsordner entpackt (zizmor: artipacked).
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          path: artefakte
          merge-multiple: true
      - name: Release-Namen bestimmen
        id: name
        shell: bash
        run: |
          if [ "${{ needs.version.outputs.art }}" = "release" ]; then
            # Der Tag existiert bereits (von Hand gesetzt oder eben gepusht) — kein --target.
            echo "tag=${{ needs.version.outputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "test=false" >> "$GITHUB_OUTPUT"
            echo "zusatz=" >> "$GITHUB_OUTPUT"
          else
            # Testbau: eigener Name mit Laufnummer, damit er keinen echten v-Tag belegt.
            echo "tag=v$(node -p "require('./package.json').version")-build${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "test=true" >> "$GITHUB_OUTPUT"
            echo "zusatz=--draft --prerelease --target ${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi
      - name: Release anlegen oder Artefakte hochladen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.name.outputs.tag }}
          IS_TEST: ${{ steps.name.outputs.test }}
          ZUSATZ: ${{ steps.name.outputs.zusatz }}
        shell: bash
        run: |
          set -euo pipefail
          ls -la artefakte/

          # Bei einem echten Release traegt der TITEL schon „Transkribor <Tag>" — eine
          # Wiederholung im Rumpf waere die erste Zeile Textwand. Beim Testbau steht dort
          # etwas, das man sonst nirgends sieht (Branch und SHA), also bleibt sie.
          if [ "$IS_TEST" = "true" ]; then
            kopf="Unsignierte Testbauten aus \`${GITHUB_REF_NAME}\` (${GITHUB_SHA:0:7}) — kein Release."
          else
            kopf=""
          fi

          # Der Release-Text kommt aus RELEASE-NOTIZEN.md — drei Wege, in dieser Reihenfolge:
          #
          #  1. der Abschnitt DIESER Fassung. Der Regelfall: der version-Job hat ihn eben
          #     angelegt, und wir haben genau diesen Tag ausgecheckt.
          #  2. `## Unveröffentlicht`. Greift bei einem von Hand gesetzten Tag (dort rotiert
          #     niemand) UND beim Testbau (dort gibt es noch keinen Abschnitt) — Letzteres ist
          #     der Weg, auf dem sich diese Mechanik ohne echtes Release pruefen laesst.
          #     Der Preis ist benannt, nicht uebersehen: ein Hand-Tag VEROEFFENTLICHT diese
          #     Zeilen, ROTIERT sie aber nicht — das naechste regulaere Release bringt
          #     dieselben Zeilen also ein zweites Mal. So entschieden (ein Hand-Tag ist ein
          #     Sonderweg und soll nichts auf master umschreiben); wer das aendert, aendert
          #     damit auch, was ein Hand-Tag auf master anfasst.
          #  3. die Commit-Betreffe seit dem vorigen Tag, ausdruecklich als Ersatz markiert.
          #     Nicht schoen, und das ist Absicht: die Luecke soll im Release sichtbar sein,
          #     statt dass jemand Stunden spaeter von Hand nachtraegt (Issue #466).
          #
          # Gehoben wird BYTE-GENAU. Der Workflow formuliert nichts um — was in der Datei
          # steht, hat ein Mensch fuer Menschen geschrieben.
          # Weg 1 sammelt mit: `body` liefert den eigenen Abschnitt PLUS jeden aelteren, zu dem
          # es kein Release gibt. Ein gescheiterter Bau hat den Release-Commit samt Rotation
          # naemlich schon auf master — ohne das Einsammeln waeren jene Notizen fuer immer weg,
          # weil die naechste Rotation nur nimmt, was SEITDEM dazukam. Die Entscheidung steht
          # in scripts/notizen.sh, damit scripts/notizen.test.sh genau das prueft, was hier
          # laeuft — dieselbe Begruendung wie bei versionshoehe.sh im version-Job.
          # Bei unklarer API-Antwort endet `body` mit 1; `set -e` bricht den Lauf dann ab,
          # und das ist gewollt: lieber kein Release als eines mit falschem Text.
          notiz="$(bash scripts/notizen.sh body RELEASE-NOTIZEN.md "$TAG")"
          [ -n "$notiz" ] || notiz="$(bash scripts/notizen.sh lesen RELEASE-NOTIZEN.md 'Unveröffentlicht')"
          if [ -z "$notiz" ]; then
            # `HEAD^` NUR beim echten Release: dort zeigt der eben gepusste Tag auf HEAD, und
            # `fassung.sh HEAD` gaebe genau ihn zurueck — der Bereich waere leer. Beim Testbau
            # ist `ref` leer, der Checkout landet auf dem Branch-Kopf; laege dort der letzte
            # Release-Tag (direkt nach einem Release-Commit ohne weiteren Push), lieferte
            # `HEAD^` die VORVORIGE Fassung, und die Ersatzliste zaehlte die Aenderungen eines
            # bereits veroeffentlichten Releases erneut auf.
            if [ "$IS_TEST" = "true" ]; then bezug=HEAD; else bezug=HEAD^; fi
            vorher="$(bash scripts/fassung.sh "$bezug")"
            if [ -n "$vorher" ]; then bereich="$vorher..HEAD"; else bereich="HEAD"; fi
            notiz="$(bash scripts/notizen.sh ersatzliste "$bereich")"
          fi

          # Der Plattform-Hinweis steht in EINER Zeile hinter einem Trenner — er gilt jeder
          # Fassung gleich und soll die Notiz nicht zudecken (Marcus: „keine lange Textwand").
          plattform='**macOS:** braucht macOS 13 oder neuer; ad-hoc signiert — beim ersten Start Rechtsklick > *Öffnen* (macOS 15+: *Systemeinstellungen > Datenschutz & Sicherheit > Dennoch öffnen*). **Windows:** unsigniert — SmartScreen: *Weitere Informationen* > *Trotzdem ausführen*. Erster Start richtet die Python-Seite ein (mehrere GB, 10–30 Minuten).'
          if [ -n "$kopf" ]; then
            rumpf="$(printf '%s\n\n%s\n\n---\n%s\n' "$kopf" "$notiz" "$plattform")"
          else
            rumpf="$(printf '%s\n\n---\n%s\n' "$notiz" "$plattform")"
          fi

          view_out=""
          if view_out=$(gh release view "$TAG" 2>&1); then
            echo "Release $TAG existiert bereits — lade gebaute Installer hoch..."
            gh release upload "$TAG" artefakte/* --clobber
          elif echo "$view_out" | grep -qiE "release not found|404"; then
            echo "Erstelle neues Release $TAG mit Build-Artefakten..."
            # shellcheck disable=SC2086
            gh release create "$TAG" \
              $ZUSATZ \
              --title "Transkribor $TAG" \
              --notes "$rumpf" \
              artefakte/*
          else
            echo "Fehler beim Prüfen des Release-Tags $TAG:"
            echo "$view_out"
            exit 1
          fi
