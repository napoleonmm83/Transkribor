name: Tests

# Laeuft bei jedem PR und auf master. Bis hierher lief KEINE der drei Suiten automatisch —
# nur `npm run test:electron`, und das erst im Release-Workflow, also lange nach dem Merge.
# 369 von 403 Tests haben sich darauf verlassen, dass jemand sie von Hand tippt.
on:
  pull_request:
  push:
    branches: [master]

# Ein neuer Push auf denselben PR macht den vorigen Lauf wertlos.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Alle drei Jobs LESEN nur: pytest, Vitest/tsc, die node:test-Suite und die drei
# Skript-Tests (`notizen.test.sh` faelscht `gh` und braucht kein Token).
#
# Ohne Block gilt die Vorgabe des REPOSITORYS — und die ist eine Einstellung, die ein
# Klick umlegt, kein Bestandteil dieses Workflows. Heute steht sie auf read: gemessen am
# Lauf 33417474238 bekamen `Python` und `Frontend` `Contents: read · Metadata: read ·
# Packages: read`, `Electron` (der als einziger einen Block hatte) nur die ersten beiden.
# Der Block hier schliesst also kein offenes Schreibrecht — er macht den Workflow von der
# Einstellung unabhaengig und nimmt das ungenutzte `Packages: read` weg
# (zizmor: excessive-permissions, gefunden an PR #468). Workflow-weit statt je Job, damit
# ein kuenftiger vierter Job ihn nicht vergessen kann.
permissions:
  contents: read

jobs:
  # Namen bewusst ohne Testzahlen: die erste Zahl war nach einem einzigen PR falsch (242 -> 244),
  # und ein Jobname, der luegt, ist schlechter als einer, der nichts verspricht.
  # Zwei Plattformen, weil `webtool/sperre.py` zwei Implementierungen hat und die CI bis
  # #201 nur EINE davon ausfuehrte. `_prozess_lebt()` verzweigt an `os.name == "nt"`:
  # ctypes/OpenProcess gegen `os.kill`. Auf ubuntu ist der Windows-Zweig toter Code — jede
  # Mutation darin blieb gruen, ausgerechnet in dem Zweig, den die Zielplattform als
  # einziger je ausfuehrt. Drei Tests haengen daran (`test_sperre.py`, skipif os.name != "nt"):
  # die 87-Auswertung von OpenProcess, das Windows-„delete pending" beim Freigeben (#205)
  # und die st_ino-Haelfte des Ausweises — auf ext4 ist die Inode nach rmdir+mkdir in
  # 200 von 200 Faellen dieselbe, der Test kann dort also gar nicht laufen.
  #
  # **Es sind nicht nur die drei sperre-Tests.** Der Job faehrt zwei weitere nt-Zweige
  # erstmals ueberhaupt aus: `jobs.py:_kill_tree` (`taskkill /F /T` — dafuer gibt es NUR
  # POSIX-Injektionstests, einen nt-Gegenpart nicht, der Zweig lief also nirgends) und
  # `settings.py` (%APPDATA%). Das steht hier, weil ein zu billig angeschriebener Preis
  # dieselbe Fehlerklasse ist wie ein zu teurer: wer spaeter „windows-latest raus, kostet ja
  # nur drei sperre-Tests" entscheidet, laege nach dieser Zeile falsch.
  #
  # Gemessen, nicht geschaetzt — beide Jobs desselben Laufs (31892939230):
  # ubuntu `690 passed, 3 skipped` in 22 s, windows `693 passed, 0 skipped` in 39 s.
  # Die Differenz IST der Zweck dieser Matrix.
  #
  # `-rs` macht die Skips im Protokoll sichtbar. Sonst ist dieser Waechter selbst ungewacht:
  # ein aufgeweiteter `skipif` stellte #201 wieder her, und `-q` schriebe dazu still
  # `692 passed, 1 skipped` — gruen. Ein echter Waechter (rot, wenn einer der drei
  # uebersprungen ist) steht als eigenes Issue.
  #
  # `fail-fast: false` ist Absicht: bricht Windows ab, soll trotzdem sichtbar sein, ob Linux
  # gruen war — die Information, WELCHE Plattform umfaellt, ist der ganze Zweck der Matrix.
  python:
    name: Python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      # BEWUSST ohne torch, openai-whisper, pyannote.audio und yt-dlp: die sind alle nur
      # INNERHALB von Funktionen importiert (webtool/device.py erklaert warum), die Suite
      # laeuft ohne sie durch — 40 MB statt mehreren GB, 7s statt Minuten.
      #
      # Das ist kein Sparen, sondern ein Waechter: schleicht sich ein `import torch` auf
      # Modulebene ein, faellt dieser Job um. Genau die Regression, die man sonst erst
      # bemerkt, wenn die Einstellungsseite in einer halben Umgebung nicht mehr laedt.
      #
      # scipy/scikit-learn kommen fuer tools/diar_eval.py dazu (Metriken der
      # Sprechertrennungs-Messung). Sie brechen den Waechter oben NICHT: er zielt auf
      # torch/pyannote/whisper — die bleiben draussen, ein Modulebenen-Import davon laesst
      # den Job weiterhin umfallen. ~60 MB, kein GB-Sprung.
      - run: pip install fastapi python-multipart pytest httpx scipy scikit-learn

      # osv_freeze-Tests: pytest sammelt scripts/ nicht — eigener Schritt,
      # Vorbild scripts/versionshoehe.test.sh im Job electron.
      - run: python scripts/test_osv_freeze.py

      # Derselbe Grund fuer den zweiten scripts/-Waechter — aber NICHT dieselbe Form.
      # test_weg_benchmark.py ist pytest-Stil (tmp_path-Fixture, kein Hauptblock): direkt mit
      # python aufgerufen wie der Nachbar darueber laeuft er mit Exitcode 0 und NULL Tests
      # durch — nachgestellt, nicht vermutet. Er kam mit #508 ins Repo und lief bis hierher
      # in KEINEM Workflow; ein Waechter ohne Aufrufweg ist keiner.
      #
      # Er braucht den Repo-Stamm als Arbeitsverzeichnis (`import webtool.app` fuer
      # `_weg_alter`) und die pip-Zeile oben. Ohne `if`, wie der osv-Nachbar: die drei Faelle
      # dauern zusammen 8,5 s (auf Windows gemessen), und .weg-Reste sind gerade der
      # Windows-Fall aus #459.
      - run: python -m pytest scripts/test_weg_benchmark.py -q

      # `build` muss explizit dastehen: der Ordnername steht in pytests
      # norecursedirs, ein blankes `pytest` sammelt build/test_bilder.py NIE.
      # Als Pfadangabe wird die Regel ausgehebelt. Genau dafuer kommt der Test
      # ohne PIL aus.
      - run: python -m pytest webtool build -q -rs

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: webtool/frontend/package-lock.json

      - run: npm ci --no-audit --fund=false
        working-directory: webtool/frontend

      - run: npm test
        working-directory: webtool/frontend

      # Nicht redundant zu `npm test`: vitest transpiliert nur, `build` faehrt `tsc -b`
      # davor. Typfehler in ungetesteten Pfaden faellt sonst niemandem auf.
      - run: npm run build
        working-directory: webtool/frontend

  # Drei Plattformen, und der Anlass ist gemessen: am 2026-08-28 starb der Release-Lauf
  # 33183032424 im Job „bauen (macos-latest)" an genau dieser Suite — 189 Tests, 1 fail
  # (`titelleisteFarbe reicht nur geprueftes Hex durch`, ein plattformblinder Test gegen die
  # `darwin`-Wache in fenster.js). Bis dahin lief das Bein im PR nur auf ubuntu, waehrend
  # dieselbe Suite im Release-Workflow auf der vollen Matrix laeuft (release.yml:123,
  # `runs-on: ${{ matrix.os }}`) — der Release-Lauf war also der ERSTE Mac-Test, nach dem
  # Merge UND nach dem Versions-Tag. Das ist die teuerste denkbare Stelle dafuer:
  # `veroeffentlichen` wird uebersprungen, aber Tag und Versions-Commit stehen bereits auf
  # master, und der naechste Anlauf braucht eine neue Versionsnummer (#464).
  #
  # **Warum die vorhandenen Stubs das nicht ersetzen.** setup.test.js tauscht
  # `process.platform` per `aufPlattform()` aus und deckt damit die VERZWEIGUNG ab — nicht
  # die Plattform. Was ein Stub nicht mitdreht: `path.sep`, die fs-Semantik, das Verhalten
  # von `spawn` und die plattformabhaengigen Teile von Node selbst. `paths.venvPython`
  # (paths.js:33-37) ist das saubere Beispiel: der Stub waehlt zwar den win32-Zweig,
  # `path.join(venvDir, 'Scripts', 'python.exe')` liefert auf einem Linux-Laeufer trotzdem
  # `/`-Trenner. Acht Stellen lesen `process.platform` direkt gegen 'win32'
  # (paths.js:34, backend.js:102, setup.js:137/195/232/234/251/424), drei gegen 'darwin'
  # (setup.js:42/110, main.js:360) und eine gegen 'linux' (setup.js:116).
  #
  # **Und es kostet hier nichts.** Das Repo ist oeffentlich, GitHub rechnet Standard-Laeufer
  # dort mit null ab — gemessen am Timing-API des Release-Laufs 33552444910:
  # `MACOS.billable.total_ms = 0`, ebenso WINDOWS und UBUNTU. Der 10-fach-Faktor, mit dem
  # #464 noch rechnete, gilt fuer bezahlte Minuten und nicht fuer dieses Repo. Die Suite
  # selbst dauert 1,3 s (auf einem M1 Pro gemessen); die Laufzeit des Beins ist `npm ci`.
  #
  # `fail-fast: false` aus demselben Grund wie oben bei python: WELCHE Plattform umfaellt,
  # ist die ganze Information.
  #
  # Der job-eigene `permissions`-Block stand bis #470 hier und ist in den
  # workflow-weiten oben aufgegangen — er sagte dasselbe, und zwei Stellen fuer eine
  # Regel driften.
  electron:
    name: Electron (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci --no-audit --fund=false

      # `node --test electron/*.test.js`: npm faehrt Skripte auf Windows durch cmd.exe, und
      # cmd expandiert keine Globs — node bekommt das Muster dann woertlich und loest es
      # selbst auf (seit Node 22). Nachgestellt, nicht gehofft: `node --test
      # 'electron/*.test.js'` (in Anfuehrungszeichen, damit die Shell nichts expandiert)
      # sammelt dieselben 197 Tests.
      - run: npm run test:electron

      # Die drei Skripttests bleiben auf ubuntu — sie pruefen Release-WERKZEUG, nicht
      # Plattformverhalten, und tragen eine POSIX-Annahme: notizen.test.sh legt ein
      # gefaelschtes `gh` mit Shebang an und macht es per `chmod +x` ausfuehrbar. Sie auf
      # drei Laeufern zu wiederholen fuegte kein Wissen hinzu, koennte aber auf Windows aus
      # einem Umgebungsgrund rot werden — und ein rotes Bein, das nichts ueber das Produkt
      # sagt, ist genau die Sorte Waechter, die man nach zwei Wochen abschaltet.
      #
      # Prueft die Versionslogik, die ueber Nummern entscheidet, die man nach dem
      # Veroeffentlichen nicht zurueckholt. Lief bisher nur im Release-Workflow — also erst,
      # wenn ein Fehler darin schon teuer geworden waere.
      - if: runner.os == 'Linux'
        run: bash scripts/versionshoehe.test.sh

      # Dieselbe Begruendung: notizen.sh SCHREIBT in den Release-Commit (die Rotation) und
      # liefert den Text, den der Nutzer auf der Releases-Seite liest. Beides ist nach dem
      # Push nicht mehr still zu korrigieren.
      - if: runner.os == 'Linux'
        run: bash scripts/notizen.test.sh

      # Und aus demselben Grund fassung.sh: es waehlt den Tag, ab dem versionshoehe.sh
      # rechnet. Ein Fehler darin verschiebt eine Versionsnummer, die nach dem
      # Veroeffentlichen niemand mehr zurueckholt.
      - if: runner.os == 'Linux'
        run: bash scripts/fassung.test.sh
