name: Tests

# Laeuft bei jedem PR und auf master. Bis hierher lief KEINE der drei Suiten automatisch —
# nur `npm run test:electron`, und das erst im Release-Workflow, also lange nach dem Merge.
# 369 von 403 Tests haben sich darauf verlassen, dass jemand sie von Hand tippt.
on:
  pull_request:
  push:
    branches: [master]

# Ein neuer Push auf denselben PR macht den vorigen Lauf wertlos.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Sechs der sieben Jobs LESEN nur: pytest, Vitest/tsc, die node:test-Suite, die vier
# Skript-Tests (`notizen.test.sh` faelscht `gh` und braucht kein Token) und die beiden
# Riegel `Ruff` und `Mypy`.
# Der siebte, `Mutationsprobe`, SCHREIBT — und das ist kein Widerspruch zum Block unten:
# er aendert Dateien in seinem EIGENEN, wegwerfbaren Checkout (Mutation setzen, Tests
# fahren, Originalbytes zurueckschreiben) und spielt nichts zurueck ins Repository. Kein
# Commit, kein Push, kein Token — `contents: read` reicht ihm genauso.
# (Diese Zeile sagte „drei Jobs" und „drei Skript-Tests", als es schon fuenf bzw. vier
# waren — eine Zahl in einem Kommentar driftet unsichtbar, genau wie an #536. Wer hier
# einen Job ergaenzt, zaehlt sie nach — und zwar AB `jobs:`, sonst zaehlen `pull_request:`
# und `push:` mit und die Antwort ist 8 statt 6 (genau so ist der erste Entwurf dieser
# Zeile danebengegangen):
#     sed -n '/^jobs:/,$p' .github/workflows/test.yml | grep -cE '^  [a-z_-]+:$'
# Gegengeprueft am YAML-Parser: beide sagen 7. Nachgezogen am 2026-09-05 beim Job
# `Mutationsprobe` — genau der Handgriff, den diese Klammer verlangt.)
#
# Ohne Block gilt die Vorgabe des REPOSITORYS — und die ist eine Einstellung, die ein
# Klick umlegt, kein Bestandteil dieses Workflows. Heute steht sie auf read: gemessen am
# Lauf 33417474238 bekamen `Python` und `Frontend` `Contents: read · Metadata: read ·
# Packages: read`, `Electron` (der als einziger einen Block hatte) nur die ersten beiden.
# Der Block hier schliesst also kein offenes Schreibrecht — er macht den Workflow von der
# Einstellung unabhaengig und nimmt das ungenutzte `Packages: read` weg
# (zizmor: excessive-permissions, gefunden an PR #468). Workflow-weit statt je Job, damit
# ein kuenftiger siebter Job ihn nicht vergessen kann. (Der ist am 2026-09-05 gekommen —
# `Mutationsprobe` — und hat ihn tatsaechlich nicht vergessen muessen.)
permissions:
  contents: read

jobs:
  # Namen bewusst ohne Testzahlen: die erste Zahl war nach einem einzigen PR falsch (242 -> 244),
  # und ein Jobname, der luegt, ist schlechter als einer, der nichts verspricht.
  # Zwei Plattformen, weil `webtool/sperre.py` zwei Implementierungen hat und die CI bis
  # #201 nur EINE davon ausfuehrte. `_prozess_lebt()` verzweigt an `os.name == "nt"`:
  # ctypes/OpenProcess gegen `os.kill`. Auf ubuntu ist der Windows-Zweig toter Code — jede
  # Mutation darin blieb gruen, ausgerechnet in dem Zweig, den die Zielplattform als
  # einziger je ausfuehrt. Drei Tests haengen daran (`test_sperre.py`, skipif os.name != "nt"):
  # die 87-Auswertung von OpenProcess, das Windows-„delete pending" beim Freigeben (#205)
  # und die st_ino-Haelfte des Ausweises — auf ext4 ist die Inode nach rmdir+mkdir in
  # 200 von 200 Faellen dieselbe, der Test kann dort also gar nicht laufen.
  #
  # **Es sind nicht nur die drei sperre-Tests.** Der Job faehrt zwei weitere nt-Zweige
  # erstmals ueberhaupt aus: `jobs.py:_kill_tree` (`taskkill /F /T` — dafuer gibt es NUR
  # POSIX-Injektionstests, einen nt-Gegenpart nicht, der Zweig lief also nirgends) und
  # `settings.py` (%APPDATA%). Das steht hier, weil ein zu billig angeschriebener Preis
  # dieselbe Fehlerklasse ist wie ein zu teurer: wer spaeter „windows-latest raus, kostet ja
  # nur drei sperre-Tests" entscheidet, laege nach dieser Zeile falsch.
  #
  # Gemessen, nicht geschaetzt — beide Jobs desselben Laufs (31892939230):
  # ubuntu `690 passed, 3 skipped` in 22 s, windows `693 passed, 0 skipped` in 39 s.
  # Die Differenz IST der Zweck dieser Matrix.
  #
  # `-rs` macht die Skips im Protokoll sichtbar. Sonst ist dieser Waechter selbst ungewacht:
  # ein aufgeweiteter `skipif` stellte #201 wieder her, und `-q` schriebe dazu still
  # `692 passed, 1 skipped` — gruen. Ein echter Waechter (rot, wenn einer der drei
  # uebersprungen ist) steht als eigenes Issue.
  #
  # `fail-fast: false` ist Absicht: bricht Windows ab, soll trotzdem sichtbar sein, ob Linux
  # gruen war — die Information, WELCHE Plattform umfaellt, ist der ganze Zweck der Matrix.
  python:
    name: Python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      # BEWUSST ohne torch, openai-whisper, pyannote.audio und yt-dlp: die sind alle nur
      # INNERHALB von Funktionen importiert (webtool/device.py erklaert warum), die Suite
      # laeuft ohne sie durch — 40 MB statt mehreren GB, 7s statt Minuten.
      #
      # Das ist kein Sparen, sondern ein Waechter: schleicht sich ein `import torch` auf
      # Modulebene ein, faellt dieser Job um. Genau die Regression, die man sonst erst
      # bemerkt, wenn die Einstellungsseite in einer halben Umgebung nicht mehr laedt.
      #
      # scipy/scikit-learn kommen fuer tools/diar_eval.py dazu (Metriken der
      # Sprechertrennungs-Messung). Sie brechen den Waechter oben NICHT: er zielt auf
      # torch/pyannote/whisper — die bleiben draussen, ein Modulebenen-Import davon laesst
      # den Job weiterhin umfallen. ~60 MB, kein GB-Sprung.
      - run: pip install fastapi python-multipart pytest httpx scipy scikit-learn

      # KEINE Pfadangaben mehr — und das ist der Fix, nicht Kosmetik.
      #
      # `pyproject.toml` deklariert `testpaths = ["webtool", "build", "scripts"]`, mit einer
      # Begruendung je Eintrag. Diese Zeile nannte davon ZWEI, und pytest ignoriert
      # `testpaths`, sobald Pfade auf der Kommandozeile stehen — die dritte fiel damit still
      # heraus. Zwei Stellen fuer eine Regel driften; die Reparatur nimmt die zweite weg,
      # statt sie nachzuziehen (dieselbe Entscheidung wie beim permissions-Block oben, #470).
      #
      # GEMESSEN, alle drei am selben Baum (`--collect-only -q` auf master):
      #     ohne Pfadangaben               1176
      #     webtool build scripts          1176   <- gleichwertig, nur eine zweite Liste
      #     webtool build (bisherige CI)   1160   <- 16 Tests fehlten
      #
      # Die 16 sind die drei Testdateien in scripts/, von denen bis hierher nur EINE lief:
      # test_osv_freeze.py, ueber einen eigenen `python scripts/test_osv_freeze.py`-Schritt.
      # Der ist entfallen — sein Hauptblock ruft genau die `test_*`-Funktionen auf, die
      # pytest ohnehin einsammelt, er lief also doppelt. Die anderen beiden,
      # test_coderabbit_status.py und test_weg_benchmark.py (#508), sind pytest-Stil OHNE
      # Hauptblock: direkt mit python aufgerufen enden sie mit Exitcode 0 und NULL Tests,
      # nachgestellt und nicht vermutet. Ein Waechter ohne Aufrufweg ist keiner.
      #
      # WORAN die Zahlen haengen: test_weg_benchmark.py kam mit #508 auf master und liegt
      # NICHT auf dem Zweig dieses PR. Die CI laeuft auf `refs/pull/N/merge` und sieht sie;
      # wer den Zweig allein auscheckt, zaehlt 13 statt 16. Nach dem Rebase-Merge ist der
      # Unterschied weg.
      #
      # **`python -m` ist hier NICHT tragend** — und das gehoert dazu, weil es so AUSSIEHT:
      # test_weg_benchmark.py importiert `webtool.app`, und `pytest scripts` allein faellt
      # damit auf die Nase (gemessen: 1 failed, ModuleNotFoundError). In DIESEM Lauf traegt
      # es `webtool/__init__.py` — pytest legt beim Sammeln den Paket-Stamm auf sys.path,
      # also den Repo-Stamm, und danach findet auch scripts/ das Paket (gemessen: nacktes
      # `pytest` 1173 passed). Das `python -m` bleibt trotzdem stehen: es kostet nichts und
      # macht die Zeile von dieser Feinheit unabhaengig.
      #
      # Preis, am Laeufer gemessen (Python windows-latest): der pytest-Schritt 33,87 s ->
      # 47,14 s. Das ist NICHT rein die Pfadaenderung — derselbe Lauf bekam ueber den Merge
      # auch #508s eigene Tests dazu (1135 -> 1172 passed). Isoliert am selben Baum, lokal:
      # 1157 -> 1173 Tests, 40 s -> 63 s. Der Aufwand steckt in den weg-Faellen, die
      # Wegwerf-Baeume aus je 3.605 Dateien und 900 Ordnern anlegen (`DATEIEN`/`PROJEKTE`
      # in scripts/weg_benchmark.py), mehrfach je Lauf.
      - run: python -m pytest -q -rs

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: webtool/frontend/package-lock.json

      - run: npm ci --no-audit --fund=false
        working-directory: webtool/frontend

      - run: npm test
        working-directory: webtool/frontend

      # Nicht redundant zu `npm test`: vitest transpiliert nur, `build` faehrt `tsc -b`
      # davor. Typfehler in ungetesteten Pfaden faellt sonst niemandem auf.
      - run: npm run build
        working-directory: webtool/frontend

  # Drei Plattformen, und der Anlass ist gemessen: am 2026-08-28 starb der Release-Lauf
  # 33183032424 im Job „bauen (macos-latest)" an genau dieser Suite — 189 Tests, 1 fail
  # (`titelleisteFarbe reicht nur geprueftes Hex durch`, ein plattformblinder Test gegen die
  # `darwin`-Wache in main.js:360 — fenster.js:24 entscheidet nur `hiddenInset`). Bis dahin
  # lief das Bein im PR nur auf ubuntu, waehrend
  # dieselbe Suite im Release-Workflow auf der vollen Matrix laeuft (release.yml:182,
  # `runs-on: ${{ matrix.os }}`) — der Release-Lauf war also der ERSTE Mac-Test, nach dem
  # Merge UND nach dem Versions-Tag. Das ist die teuerste denkbare Stelle dafuer:
  # `veroeffentlichen` wird uebersprungen, aber Tag und Versions-Commit stehen bereits auf
  # master, und der naechste Anlauf braucht eine neue Versionsnummer (#464).
  #
  # **Warum die vorhandenen Stubs das nicht ersetzen.** setup.test.js tauscht
  # `process.platform` per `aufPlattform()` aus und deckt damit die VERZWEIGUNG ab — nicht
  # die Plattform. Was ein Stub nicht mitdreht: `path.sep`, die fs-Semantik, das Verhalten
  # von `spawn` und die plattformabhaengigen Teile von Node selbst. `paths.venvPython`
  # (paths.js:33-37) ist das saubere Beispiel: der Stub waehlt zwar den win32-Zweig,
  # `path.join(venvDir, 'Scripts', 'python.exe')` liefert auf einem Linux-Laeufer trotzdem
  # `/`-Trenner. Acht Stellen lesen `process.platform` direkt gegen 'win32'
  # (paths.js:34, backend.js:102, setup.js:137/195/232/234/251/424), drei gegen 'darwin'
  # (setup.js:42/110, main.js:360) und eine gegen 'linux' (setup.js:116).
  #
  # **Und es kostet hier nichts — solange das Repo OEFFENTLICH bleibt.** Genau daran haengt
  # es: GitHub rechnet Standard-Laeufer in oeffentlichen Repos mit null ab, gemessen am
  # Timing-API des Release-Laufs 33552444910: `MACOS.billable.total_ms = 0`, ebenso WINDOWS
  # und UBUNTU. Der 10-fach-Faktor, mit dem #464 noch rechnete, gilt fuer bezahlte Minuten.
  # Wird das Repo je privat, ist diese Matrix neu zu rechnen.
  # Die Suite selbst dauert 1,3 s (auf einem M1 Pro gemessen); die Laufzeit des Beins ist
  # ueberwiegend Ruestzeit — im Windows-Bein des Laufs 33567187248 sind es 30 s gesamt:
  # checkout 4 s, setup-node 6 s, `npm ci` 9 s, Tests 3 s, Aufraeumen 4 s.
  #
  # `fail-fast: false` aus demselben Grund wie oben bei python: WELCHE Plattform umfaellt,
  # ist die ganze Information.
  #
  # Der job-eigene `permissions`-Block stand bis #470 hier und ist in den
  # workflow-weiten oben aufgegangen — er sagte dasselbe, und zwei Stellen fuer eine
  # Regel driften.
  electron:
    name: Electron (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci --no-audit --fund=false

      # `node scripts/testlauf.mjs electron/*.test.js && node scripts/testlauf.mjs
      # scripts/testlauf.test.mjs`: npm faehrt Skripte auf Windows durch cmd.exe, und cmd
      # expandiert keine Globs — node bekommt das Muster dann woertlich und loest es selbst
      # auf (seit Node 21.0.0, `test_runner: support passing globs`, nodejs/node#47653 —
      # nicht erst seit 22). Beide Wege sind inzwischen nachgestellt, nicht gehofft: in
      # Anfuehrungszeichen (Shell expandiert nichts) und ueber `npm run` unter cmd.exe
      # sammelt der Lauf je dieselben Tests, 217 + 5.
      #
      # Die Huelle statt `node --test` direkt, weil ein Glob ohne Treffer sonst `tests 0` mit
      # Exitcode 0 meldet — 217 Waechter waeren ein gruener Haken (#510). Zwei Aufrufe statt
      # zwei Muster in einem: sonst halten die Selbsttests die Summe ueber null,
      # waehrend die Electron-Suite verschwindet.
      - run: npm run test:electron

  # Die drei Release-Skripttests stehen in einem EIGENEN Job, und zwar aus zwei Gruenden, die
  # beide gemessen sind.
  #
  # **Warum eigener Job und nicht `if: runner.os == 'Linux'` am electron-Bein.** Eine
  # Bedingung, die an einem Matrix-Eintrag haengt, ist ein stiller Ausfallweg: verlaesst
  # `ubuntu-latest` je die Liste — Umbenennung, Ausmusterung, Umbau der Matrix —, werden drei
  # Waechter zu `skipped`, und der Job bleibt gruen. Vorher liefen sie bedingungslos; eine
  # Verschaerfung der Plattformabdeckung darf keine Abschwaechung der Waechter einschleusen.
  # Das ist HERGELEITET aus GitHubs `if`-Semantik, nicht gemessen — nachstellen liesse es
  # sich nur, indem man die Matrix wirklich aendert.
  # Nebenbei braucht der Job weder setup-node noch `npm ci` — von den 30 s des electron-Beins
  # sind 19 s Ruestzeit, die hier ersatzlos wegfaellt.
  #
  # **Warum dieselben drei Plattformen.** Das ist die These dieses PR, auf die Skripte
  # angewandt: `release.yml:230` faehrt genau diese drei Tests im `bauen`-Job, dessen
  # `runs-on` (Zeile 182) die volle Matrix ist — also auf Windows und macOS, aber erst NACH
  # dem Versions-Tag. Sie dort zu pruefen und im PR nicht, ist dieselbe Luecke wie bei der
  # Electron-Suite, nur eine Datei weiter. Die frueher hier stehende Begruendung („koennte auf
  # Windows aus einem Umgebungsgrund rot werden") ist am Repo widerlegt: im Release-Lauf
  # 33552444910 sind alle drei Plattformen gruen, Windows eingeschlossen, und den einzigen
  # bekannten Umgebungsgrund faengt `.gitattributes` (`*.sh text eol=lf`) ab.
  #
  # Kosten: alle drei zusammen 1 s auf ubuntu (Lauf 33567187248); release.yml beziffert
  # Windows/Git Bash mit 1–5 s plus 2,4 s fuer fassung.test.sh.
  #
  # Was sie pruefen, ist in allen VIER Faellen dasselbe: Logik, die ueber Versionsnummern,
  # Release-Text und den Update-Feed entscheidet — und all das holt nach dem Veroeffentlichen
  # niemand zurueck. (Seit #536 sind es vier statt drei; `macos-mindest.sh` braucht als einziges
  # `node` — der Job installiert es nicht, die Runner-Images bringen es mit.)
  # versionshoehe.sh waehlt die Nummer, notizen.sh SCHREIBT in den Release-Commit (die
  # Rotation) und liefert den Text auf der Releases-Seite, fassung.sh waehlt den Tag, ab dem
  # versionshoehe.sh ueberhaupt rechnet.
  skripte:
    name: Release-Skripte (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    # `shell: bash` ist Pflicht und nicht Geschmack: auf windows-latest ist die Vorgabe
    # PowerShell, und die Begruendung dieses Jobs stuetzt sich darauf, dass release.yml:231
    # dieselben drei Skripte auf denselben drei Plattformen gruen faehrt — DORT steht
    # `shell: bash`. Eine Kopie in einer anderen Shell reproduziert die Messung nicht, auf
    # die sie sich beruft.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/versionshoehe.test.sh
      - run: bash scripts/notizen.test.sh
      - run: bash scripts/fassung.test.sh
      # macos-mindest.sh schreibt in die latest-mac.yml, die der Mac-Updater liest — dieselbe
      # Klasse wie die drei darueber: was es entscheidet, holt nach dem Release niemand zurueck.
      - run: bash scripts/macos-mindest.test.sh

  # Bis einschliesslich #543 (ruff 0.16.5 -> 0.16.6) pflegte Renovate die Fassung eines
  # Werkzeugs, das NIRGENDS lief: nicht hier, nicht im pre-commit-Hook (6 Zeilen, kein ruff),
  # nicht in package.json. Der Pin in pyproject.toml begruendet sich mit „ein Riegel, der je
  # Rechner anders urteilt, ist kein Riegel" — und beschrieb damit einen Riegel, den es nicht
  # gab. Dieser Job ist er.
  #
  # NUR ubuntu — und die Begruendung ist GEMESSEN, an genau diesem Baum mit ruff 0.16.6:
  #   Windows (venv-Wheel):      132 bekannte Befunde, keine neuen.   rc 0
  #   ubuntu   (manylinux-Wheel): 132 bekannte Befunde, keine neuen.  rc 0
  #     -> Lauf 33809510300, Job „Ruff" (der erste Lauf dieses Jobs, PR #547)
  #   Linux-Binary unter WSL gegen denselben Baum: 132 Befunde, 0 neu / 0 behoben
  # Der einzige Unterschied zwischen den Plattformen ist der Pfadtrenner
  # (`webtool\app.py` gegen `webtool/app.py`), und den normalisiert
  # scripts/ruff_riegel.py weg; genau dieser Windows-Fall ist in
  # scripts/test_ruff_riegel.py festgenagelt, und DIESER Test laeuft im `python`-Job auf
  # BEIDEN Plattformen mit. Eine zweite Matrix-Achse pruefte hier also nichts, was nicht
  # ohnehin geprueft ist. (Die erste Fassung dieses Kommentars behauptete die
  # Plattformgleichheit, ohne die Zahlen zu nennen — beanstandet vom Vorab-Check
  # „Behauptung oder Messung" an PR #547, und zu Recht.)
  #
  # `pip install --group dev` statt `pip install ruff==…`: die Fassung steht damit an EINER
  # Stelle. Zwei Stellen fuer eine Regel driften — dieselbe Entscheidung wie beim
  # permissions-Block oben und bei den pytest-Pfaden weiter oben im python-Job.
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: pip install --group dev
      # Rot nur bei NEUEN Befunden gegen .ruff-baseline.txt. Der Baum traegt 132 bekannte;
      # ein Riegel, der ab Tag eins rot ist, wird abgeschaltet statt gelesen.
      - run: python scripts/ruff_riegel.py

  # Dasselbe Loch, dasselbe Werkzeugregal: mypy ist seit #499 exakt gepinnt (2.3.1) und lief
  # bis hierher NIRGENDS — nicht hier, nicht im pre-commit-Hook, nicht in package.json (#546).
  # Auch der Bot-Kanal fehlt ihm, den ruff wenigstens hatte (.coderabbit.yaml schaltet
  # `tools.ruff` ein, kennt aber kein mypy). Renovate pflegte also die Fassung eines
  # Werkzeugs, dessen Befunde niemand je zu sehen bekam.
  #
  # EIGENER Job statt eines zweiten Schritts im Ruff-Job oben: die beiden Riegel sollen
  # unabhaengig rot werden koennen. Als Schritt haette ein roter ruff den Lauf beendet,
  # bevor mypy ueberhaupt startet — man saehe den zweiten Befund erst nach dem Beheben des
  # ersten. Der Preis ist ein zusaetzlicher Laeufer; die Wanduhr sieht ihn nicht — GEMESSEN
  # am ersten Lauf dieses Jobs (33857436923, PR #550): der ganze Lauf 09:15:26Z→09:17:34Z
  # = 2 min 08 s, gesetzt von `Python (windows-latest)` (2 min 02 s). `Mypy` lief
  # 09:15:28Z→09:15:49Z = 21 s und war 1 min 44 s vor dem Lauf fertig.
  #
  # NUR ubuntu, obwohl `pyproject.toml` die Sicht auf `platform = "win32"` festnagelt: das
  # ist kein Widerspruch, sondern der Grund. `--platform` ist eine STATISCHE Annahme, kein
  # Laufzeitmerkmal — mypy urteilt damit ueber dieselbe Sicht, egal worauf es laeuft. Belegt
  # ist das fuer die zwei Plattformen, die hier vorkommen (Windows-Entwicklerrechner,
  # ubuntu-Laeufer), nicht fuer beliebige; gemessen am selben Baum mit 2.3.1 (2026-09-04):
  #   Standard auf Windows        68 Befunde in 19 Dateien
  #   --platform linux            70   (+2 Fehlalarme ueber `ctypes.WinDLL` in sperre.py,
  #                                     also ueber Code, der nur unter Windows laeuft)
  #   festgenagelte Sicht         65 in 18 Dateien, auf jedem Rechner gleich
  # Der zweite Teil der Festnagelung ist `no_site_packages = true`: dieser Job installiert
  # nur die dev-Gruppe, ein Entwicklerrechner hat fastapi, pillow und torch. Ohne die Zeile
  # entschiede der Paketstand darueber, was der Riegel sieht — 68 gegen 65, und teils
  # ANDERE Befunde. Beide Zeilen samt Preis stehen in pyproject.toml.
  #
  # Der Windows-Pfadtrenner ist trotzdem gepruefte Ware: scripts/test_mypy_riegel.py nagelt
  # ihn fest und laeuft im `python`-Job auf BEIDEN Plattformen mit — dieselbe Konstruktion
  # wie beim Ruff-Riegel.
  #
  # `pip install --group dev` statt `pip install mypy==…`: die Fassung steht damit an EINER
  # Stelle, genau wie beim Job darueber.
  typen:
    name: Mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: pip install --group dev
      # Rot nur bei NEUEN Typfehlern gegen .mypy-baseline.txt. Der Baum traegt 65 bekannte;
      # ein Riegel, der ab Tag eins rot ist, wird abgeschaltet statt gelesen.
      - run: python scripts/mypy_riegel.py

  # Die Mutationsprobe ist in diesem Repo Pflicht ("Logik raus -> genau dieser Test rot"),
  # war aber bis #551 keine PRUEFUNG, sondern eine Gewohnheit: der Treiber entstand je
  # Sitzung neu im Scratchpad, und die Angabe "20 von 20 gefangen" liess sich aus dem Repo
  # nicht nachrechnen.
  #
  # WARUM der Lauf in die CI gehoert und nicht bloss auf den Entwicklerrechner: ein Waechter
  # verliert seine Wirkung leise. GEMESSEN in genau diesem Repo — eine Tempo-Aenderung am
  # Stop-Hook kippte ZWEI bewiesene Mutationen von rot auf gruen, ohne dass eine Zeile Code
  # verschwand: die Eigenschaft war an eine ungetestete Stelle gewandert. Von Hand faellt so
  # etwas erst auf, wenn jemand die Probe zufaellig wiederholt. Hier faellt es beim naechsten
  # Push auf.
  #
  # ZWEI Serien, und die zweite ist die wichtigere:
  #   * gegen scripts/mypy_riegel.py — belegt, dass die Probe an einem echten Waechter greift.
  #   * gegen scripts/mutation.py SELBST — belegt, dass die Waechter des Treibers wirken.
  #     Ein Mutationstreiber, dessen eigene Zusicherungen ungeprueft sind, beweist nichts
  #     ueber andere.
  #
  # Der Treiber verweigert den Start auf schmutzigem Arbeitsbaum; ein CI-Checkout ist sauber,
  # der Riegel ist hier also stumm und stoert nicht. Endet ein Lauf mit 2, war die Suite gar
  # nicht messbar (Kommando nicht gestartet oder vorher schon rot) — das ist ausdruecklich
  # KEIN Bestehen und macht den Job rot, genau wie eine nicht gefangene Mutation.
  mutation:
    name: Mutationsprobe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: pip install --group dev
      - name: Probe gegen den mypy-Riegel
        run: >
          python scripts/mutation.py --repo . --pfad scripts/
          --test "python -m pytest scripts/test_mypy_riegel.py -q"
          --plan scripts/mutationen/mypy_riegel.json
      - name: Probe des Treibers gegen sich selbst
        run: >
          python scripts/mutation.py --repo . --pfad scripts/
          --test "python -m pytest scripts/test_mutation.py -q"
          --plan scripts/mutationen/mutation.json
