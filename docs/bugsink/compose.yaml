services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bugsink
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_BUGSINKDB}
      POSTGRES_DB: bugsink
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bugsink -d bugsink"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  web:
    image: bugsink/bugsink:2
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - SERVICE_FQDN_WEB_8000
      - SECRET_KEY=${SERVICE_BASE64_64_SECRETKEY}
      # Nur fuer den ERSTEN Start: Bugsink legt das Konto einmal an und ignoriert die Variable danach.
      # Nach dem ersten Login die Variable in Coolify loeschen und `web` neu starten — ein Passwort,
      # das nichts mehr tut, hat in der Container-Umgebung nichts verloren (Bot-Review PR #531).
      - CREATE_SUPERUSER=${BUGSINK_SUPERUSER}
      - PORT=8000
      - DATABASE_URL=postgresql://bugsink:${SERVICE_PASSWORD_BUGSINKDB}@db:5432/bugsink
      - BEHIND_HTTPS_PROXY=True
      - USE_X_FORWARDED_HOST=True
      - BASE_URL=https://bugsink.martini.digital
      - MAX_EVENT_AGE_DAYS=90
      # KEINE eigene Ratengrenze — und das ist eine Entscheidung, kein Vergessen
      # (T-002, Marcus 2026-09-05). Ein Deckel stand hier schon eingetragen
      # (100/500/50000 statt der Vorgaben 1000/5000/1 Mio) und ist nach zwei
      # unabhaengigen Reviewbefunden wieder heraus. Drei Gruende, alle gemessen:
      #
      # 1. Es gab nie ein offenes Tor. Bugsink deckelt von sich aus bei 1000 je
      #    5 Minuten und 5000 je Stunde je Projekt. Ein Amoklauf kann den Server
      #    also auch ohne unser Zutun nicht fluten.
      # 2. Alle Installationen melden in EIN Projekt (electron/backend.js). Ueber
      #    der Grenze sperrt Bugsink deshalb nicht die eine Meldung, sondern das
      #    ganze PROJEKT bis Fensterende (ingest/views.py:713-727), antwortet mit
      #    nacktem 429 OHNE Retry-After, und der Sentry-Client wartet darauf
      #    pauschal 60 s und verwirft alles ungesendet. Gezaehlt werden die
      #    Verworfenen nicht (views.py:906). Die Schleife EINES Rechners macht also
      #    die Meldungen ALLER anderen unsichtbar — und ein engerer Deckel loest
      #    genau das haeufiger aus.
      # 3. Die uebliche Meldungsmenge ist UNGEMESSEN (Fehlerberichte laufen erst
      #    seit v0.52.0). Einen Deckel unter eine Menge zu legen, die niemand
      #    gemessen hat, ist geraten — und wer raet, raet hier zulasten aller.
      #
      # Wenn ein Deckel: dann mit einer Zahl aus echten Daten. Sauber waeren
      # ohnehin getrennte Projekte je Installation; das ist der eigentliche Fix
      # und ein eigener offener Punkt.
      # Namen und Vorgaben: bugsink.com/docs/settings, Abschnitt Maximums.
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import requests; requests.get(\"http://localhost:8000/health/ready\").raise_for_status()'"]
      interval: 10s
      timeout: 20s
      retries: 10
      start_period: 30s

  # MAX_EVENT_AGE_DAYS loescht NICHT von selbst: Bugsink wendet den Deckel nur in
  # `bugsink-manage delete_old_events` (und `vacuum --old-events`) an — Doku, Abschnitt Settings.
  # Dieser Dienst faehrt den Lauf taeglich, versioniert HIER statt als Coolify-Task, damit eine neue
  # oder wiederhergestellte Bereitstellung die 90-Tage-Zusage der README nicht still verliert.
  aufraeumer:
    image: bugsink/bugsink:2
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - SECRET_KEY=${SERVICE_BASE64_64_SECRETKEY}
      - DATABASE_URL=postgresql://bugsink:${SERVICE_PASSWORD_BUGSINKDB}@db:5432/bugsink
      - BASE_URL=https://bugsink.martini.digital
      - MAX_EVENT_AGE_DAYS=90
    entrypoint: ["sh", "-c", "while true; do bugsink-manage delete_old_events; sleep 86400; done"]

volumes:
  db-data:
