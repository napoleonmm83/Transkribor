services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bugsink
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_BUGSINKDB}
      POSTGRES_DB: bugsink
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bugsink -d bugsink"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  web:
    image: bugsink/bugsink:2
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - SERVICE_FQDN_WEB_8000
      - SECRET_KEY=${SERVICE_BASE64_64_SECRETKEY}
      # Nur fuer den ERSTEN Start: Bugsink legt das Konto einmal an und ignoriert die Variable danach.
      # Nach dem ersten Login die Variable in Coolify loeschen und `web` neu starten — ein Passwort,
      # das nichts mehr tut, hat in der Container-Umgebung nichts verloren (Bot-Review PR #531).
      - CREATE_SUPERUSER=${BUGSINK_SUPERUSER}
      - PORT=8000
      - DATABASE_URL=postgresql://bugsink:${SERVICE_PASSWORD_BUGSINKDB}@db:5432/bugsink
      - BEHIND_HTTPS_PROXY=True
      - USE_X_FORWARDED_HOST=True
      - BASE_URL=https://bugsink.martini.digital
      - MAX_EVENT_AGE_DAYS=90
      # Ratengrenze je Projekt (T-002). Bugsink hat Vorgaben — 1000 je 5 Minuten,
      # 5000 je Stunde, 1 Mio je Monat —, es gab hier also nie ein offenes Tor. Was
      # fehlte, war eine ENTSCHEIDUNG statt einer Vorgabe: fuer eine Desktop-App mit
      # einer Handvoll Nutzern sind 5000 Meldungen pro Stunde sehr weit, und eine
      # Fehlerschleife schreibt genau so schnell. 100 in fuenf Minuten faengt sie
      # frueh ab und ist fuer echte Fehler immer noch reichlich. Nur am Dienst `web`:
      # `aufraeumer` nimmt keine Meldungen an, er raeumt nur auf.
      #
      # DER PREIS, und er ist nicht klein: alle Installationen melden in EIN Projekt
      # (electron/backend.js). Ueber der Grenze sperrt Bugsink das ganze PROJEKT bis
      # zum Fensterende und antwortet mit nacktem 429 ohne Retry-After; der
      # Sentry-Client wartet daraufhin pauschal 60 s und verwirft alles, ohne zu
      # senden — gezaehlt werden diese Verworfenen nicht. Die Schleife EINES Rechners
      # macht also die Meldungen ALLER unsichtbar, und der engere Deckel loest das
      # zehnmal leichter aus als Bugsinks Vorgabe. Bewusster Tausch: lieber eine
      # Schleife frueh abfangen als einen vollen Server. Sauber waeren getrennte
      # Projekte je Installation — das ist ein eigener offener Punkt.
      # Die site-weiten MAX_EVENTS_PER_* bleiben auf Vorgabe; bei einem einzigen
      # Projekt binden ohnehin die Projekt-Grenzen zuerst.
      # Namen und Vorgaben: bugsink.com/docs/settings, Abschnitt Maximums.
      - MAX_EVENTS_PER_PROJECT_PER_5_MINUTES=100
      - MAX_EVENTS_PER_PROJECT_PER_HOUR=500
      - MAX_EVENTS_PER_PROJECT_PER_MONTH=50000
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import requests; requests.get(\"http://localhost:8000/health/ready\").raise_for_status()'"]
      interval: 10s
      timeout: 20s
      retries: 10
      start_period: 30s

  # MAX_EVENT_AGE_DAYS loescht NICHT von selbst: Bugsink wendet den Deckel nur in
  # `bugsink-manage delete_old_events` (und `vacuum --old-events`) an — Doku, Abschnitt Settings.
  # Dieser Dienst faehrt den Lauf taeglich, versioniert HIER statt als Coolify-Task, damit eine neue
  # oder wiederhergestellte Bereitstellung die 90-Tage-Zusage der README nicht still verliert.
  aufraeumer:
    image: bugsink/bugsink:2
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - SECRET_KEY=${SERVICE_BASE64_64_SECRETKEY}
      - DATABASE_URL=postgresql://bugsink:${SERVICE_PASSWORD_BUGSINKDB}@db:5432/bugsink
      - BASE_URL=https://bugsink.martini.digital
      - MAX_EVENT_AGE_DAYS=90
    entrypoint: ["sh", "-c", "while true; do bugsink-manage delete_old_events; sleep 86400; done"]

volumes:
  db-data:
