<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Transkribor</title>
<style>
  @font-face { font-family:"Space Grotesk"; src:url("fonts/space-grotesk.woff2") format("woff2");
               font-weight:400 700; font-display:swap; }
  @font-face { font-family:"DM Sans"; src:url("fonts/dm-sans.woff2") format("woff2");
               font-weight:400 700; font-display:swap; }
  :root { color-scheme: light dark;
          --bg:#FAFAFA; --fg:#18181B; --dim:#52525B; --line:#E4E4E7; --akzent:#4F46E5;
          --akzent-fg:#FFFFFF; --karte:#FFFFFF; --log-bg:#F4F4F5; --fehler-rand:#FCA5A5;
          --fehler-bg:#FEF2F2; --fehler-fg:#B91C1C; --ok:#16A34A; --fehlt:#CA8A04; }
  @media (prefers-color-scheme: dark) {
    /* #4F46E5 erreicht auf #0B0B0F keine 3:1 — der dunkle Akzent MUSS aufgehellt sein. */
    :root { --bg:#0B0B0F; --fg:#FAFAFA; --dim:#A1A1AA; --line:#26262B; --akzent:#818CF8;
            --akzent-fg:#0B0B0F; --karte:#141419; --log-bg:#08080A; --fehler-rand:#7A3B3B;
            --fehler-bg:#1D1113; --fehler-fg:#FFB4B4; --ok:#66D19E; --fehlt:#E0B341; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:14px/1.55 "DM Sans", ui-sans-serif, system-ui, sans-serif;
         display:flex; align-items:center; justify-content:center; min-height:100vh; padding:32px; }
  .karte { width:min(720px,100%); }
  h1 { margin:0 0 4px; font-size:22px; font-weight:600;
       font-family:"Space Grotesk", ui-sans-serif, system-ui, sans-serif; letter-spacing:-.01em; }
  p.sub { margin:0 0 24px; color:var(--dim); }
  ul.check { list-style:none; margin:0 0 20px; padding:0; border:1px solid var(--line); border-radius:8px; }
  ul.check li { display:flex; gap:10px; align-items:baseline; padding:10px 14px; border-bottom:1px solid var(--line); }
  ul.check li:last-child { border-bottom:0; }
  .mark { width:1.2em; flex:0 0 auto; }
  .ok { color:var(--ok); } .fehlt { color:var(--fehlt); }
  .was { flex:1; } .wert { color:var(--dim); font-size:12px; text-align:right; word-break:break-all; }
  button { font:inherit; padding:9px 18px; border-radius:7px; border:1px solid var(--akzent);
           background:var(--akzent); color:var(--akzent-fg); font-weight:600; cursor:pointer; }
  button[disabled] { opacity:.5; cursor:default; }
  button.leise { background:transparent; color:var(--fg); border-color:var(--line); font-weight:400; }
  /* Im Fehlerfall ist die Protokolldatei das Einzige, was der Nutzer weitergeben kann. */
  button.hervor { border-color:var(--akzent); color:var(--akzent); }
  .zeile { display:flex; gap:10px; align-items:center; }
  #phase { color:var(--akzent); }
  #log { display:none; margin-top:18px; max-height:34vh; overflow:auto; background:var(--log-bg); border:1px solid var(--line);
         border-radius:8px; padding:10px 12px; font:12px/1.5 ui-monospace, Consolas, monospace; color:var(--dim);
         white-space:pre-wrap; word-break:break-word; }
  #fehler { display:none; margin-top:16px; border:1px solid var(--fehler-rand); background:var(--fehler-bg); border-radius:8px;
            padding:12px 14px; color:var(--fehler-fg); white-space:pre-wrap; }
  .hinweis { margin-top:14px; color:var(--dim); font-size:12px; }
  /* Der Befehl muss zum Kopieren taugen: markierbar, monospace, abgesetzt. */
  #befehl { display:none; margin-top:14px; border:1px solid var(--line); border-radius:8px;
            padding:10px 12px; background:var(--log-bg); color:var(--fg);
            font:12px/1.6 ui-monospace, Consolas, monospace; user-select:text; white-space:pre-wrap; }
</style>
</head>
<body>
<div class="karte">
  <img src="marke.png" width="38" height="38" alt="">
  <h1>Transkribor</h1>
  <p class="sub" id="sub">Prüfe die Umgebung …</p>

  <ul class="check" id="check"></ul>

  <div class="zeile">
    <button id="los" style="display:none">Jetzt einrichten</button>
    <button id="logbtn" class="leise">Details</button>
    <button id="datei" class="leise" title="Vollständiges Protokoll im Dateimanager zeigen">Protokoll öffnen</button>
    <span id="phase"></span>
  </div>

  <div id="fehler"></div>
  <p id="befehl"></p>
  <pre id="log"></pre>
  <p class="hinweis" id="hinweis"></p>
</div>

<script>
const $ = id => document.getElementById(id)
const log = $('log'), check = $('check')

function zeile(was, ok, wert) {
  const li = document.createElement('li')
  li.innerHTML = `<span class="mark ${ok ? 'ok' : 'fehlt'}">${ok ? '✓' : '•'}</span>` +
                 `<span class="was"></span><span class="wert"></span>`
  li.children[1].textContent = was
  li.children[2].textContent = wert || (ok ? '' : 'wird eingerichtet')
  check.appendChild(li)
}

function zeigeStatus(s) {
  check.innerHTML = ''
  zeile('Python', !!s.python, s.python)
  zeile('ffmpeg', !!s.ffmpeg, s.ffmpeg)
  // Nur auf macOS: dort ist whisper-cpp die schnelle Engine (Metal). Fehlt sie, läuft
  // alles weiter — sechsmal langsamer. Das gehört sichtbar in die Liste und nicht in
  // eine Fußnote, sonst sucht der Nutzer die Ursache bei seiner Hardware.
  if (s.whispercpp !== undefined && navigator.platform.startsWith('Mac')) {
    zeile('whisper-cpp (Apple-GPU)', !!s.whispercpp, s.whispercpp || 'fehlt — Transkription läuft langsam auf der CPU')
  }
  zeile('Python-Umgebung (Whisper, PyTorch)', s.venv, s.venv ? s.venvPfad : '')
  $('hinweis').textContent = 'Projekte liegen in ' + s.projektePfad
  // Auf macOS/Linux installiert die App Python/ffmpeg nicht selbst. Dann ist dieser Befehl das
  // Einzige, was weiterhilft — er gehört vor den Klick, nicht in eine rote Box danach.
  $('befehl').textContent = s.hinweis || ''
  $('befehl').style.display = s.hinweis ? 'block' : 'none'
  if (s.venv) {
    $('sub').textContent = 'Alles bereit — starte …'
    $('los').style.display = 'none'
  } else if (s.hinweis) {
    $('sub').textContent = 'Transkribor braucht Python und ffmpeg. Bitte den Befehl unten einmal ' +
      'im Terminal ausführen, dann „Jetzt einrichten“ — den Rest (Spracherkennung, mehrere GB) ' +
      'lädt die App selbst.'
    $('los').style.display = ''
  } else {
    $('sub').textContent = 'Beim ersten Start lädt Transkribor die Spracherkennung herunter ' +
      '(mehrere GB, je nach Leitung 10–30 Minuten). Danach läuft alles offline auf deinem Rechner.'
    $('los').style.display = ''
  }
}

function anhaengen(z) {
  log.textContent += z + '\n'
  log.scrollTop = log.scrollHeight
}

window.transkribor.on('status', zeigeStatus)
window.transkribor.on('log', anhaengen)
window.transkribor.on('phase', p => { $('phase').textContent = p.schritt + ' …' })
window.transkribor.on('fehler', t => {
  $('fehler').style.display = 'block'
  $('fehler').textContent = t
  $('phase').textContent = ''
  $('los').disabled = false
  $('los').textContent = 'Erneut versuchen'
  $('los').style.display = ''
  log.style.display = 'block'          // im Fehlerfall ist das Log das Einzige, was hilft
  $('datei').classList.add('hervor')   // ... und die Datei das, was man verschicken kann
})

$('logbtn').onclick = () => { log.style.display = log.style.display === 'block' ? 'none' : 'block' }
$('datei').onclick = async () => {
  const p = await window.transkribor.protokollOeffnen()
  $('phase').textContent = 'Protokoll: ' + p
}
$('los').onclick = async () => {
  $('los').disabled = true
  $('fehler').style.display = 'none'
  log.style.display = 'block'
  await window.transkribor.einrichten()
}

window.transkribor.status().then(zeigeStatus)
</script>
</body>
</html>
